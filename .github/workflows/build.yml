name: Build

on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache ARM SDK
        id: cache-arm-sdk
        uses: actions/cache@v4
        with:
          path: tools/gcc-arm-none-eabi-7-2018-q2-update
          key: arm-sdk-${{ hashFiles('make/tools.mk') }}

      - name: Install ARM SDK
        if: steps.cache-arm-sdk.outputs.cache-hit != 'true'
        run: make arm_sdk_install

      - name: Build xesc_all_variants
        run: make xesc_all_variants

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/xesc_all_variants/xesc_all_variants.bin
            build/xesc_all_variants/xesc_all_variants.elf

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/xesc_all_variants.bin
            artifacts/xesc_all_variants.elf
