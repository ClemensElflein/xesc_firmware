name: Build

on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache ARM SDK
        id: cache-arm-sdk
        uses: actions/cache@v4
        with:
          path: tools/gcc-arm-none-eabi-7-2018-q2-update
          key: arm-sdk-${{ hashFiles('make/tools.mk') }}

      - name: Install ARM SDK
        if: steps.cache-arm-sdk.outputs.cache-hit != 'true'
        run: make arm_sdk_install

      - name: Build xesc2_mini
        run: make xesc2_mini

      - name: Build xesc2_lite
        run: make xesc2_lite

      - name: Upload artifacts (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: xesc2_mini-${{ github.ref_name }}
          path: |
            build/xesc2_mini/xesc2_mini.bin
            build/xesc2_mini/xesc2_mini.elf
            build/xesc2_lite/xesc2_lite.bin
            build/xesc2_lite/xesc2_lite.elf

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: xesc2_mini-${{ github.ref_name }}
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/xesc2_mini.bin
            artifacts/xesc2_mini.elf
            artifacts/xesc2_lite.bin
            artifacts/xesc2_lite.elf
